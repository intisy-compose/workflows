name: Check dashboard access

# Every port of a stack is in access/PORTS.md and listens only where its kind allows, through the shared gateway.
on:
  workflow_call:
    inputs:
      workflows_ref:
        description: Ref of intisy-compose/workflows whose check and port table to use; empty means its default branch.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stack
        uses: actions/checkout@v4
        with:
          path: stacks/${{ github.event.repository.name }}
          submodules: false

      - name: Check out the check
        uses: actions/checkout@v4
        with:
          repository: intisy-compose/workflows
          ref: ${{ inputs.workflows_ref }}
          path: workflows

      - name: Run the check
        run: bash workflows/access/check-access.sh stacks

      - name: Check the project and container names
        run: bash workflows/naming/check-naming.sh stacks

      - name: Check every volume has a role
        run: bash workflows/data-on-disk/check-volumes.sh stacks
