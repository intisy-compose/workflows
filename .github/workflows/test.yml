name: Test the checks

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    # A pull request from this repository already ran on its push; only a fork's needs this run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/self-test.yml
